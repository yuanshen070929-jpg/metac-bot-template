name: Test Bot

# Manual smoke test on the bot-testing-area tournament (practice questions, no score).
# Actions -> Test Bot -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (forecast but do not post to Metaculus)"
        type: boolean
        default: false
      max_questions:
        description: "How many test questions to forecast (each costs roughly $0.3-0.6 of LLM credit)"
        default: "4"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run offline tests
        run: uv run pytest -q
      - name: Run bot on test questions
        run: |
          EXTRA=""
          if [ "${DRY_RUN}" = "true" ]; then EXTRA="--dry-run"; fi
          uv run python run_bot.py --mode test_questions --max-questions "${MAX_QUESTIONS}" $EXTRA
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          MAX_QUESTIONS: ${{ inputs.max_questions }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          BOT_PROFILE: ${{ vars.BOT_PROFILE }}
          FORECASTER_MODELS: ${{ vars.FORECASTER_MODELS }}
          RESEARCH_MODELS: ${{ vars.RESEARCH_MODELS }}
          SAMPLES_PER_MODEL: ${{ vars.SAMPLES_PER_MODEL }}
          REASONING_EFFORT: ${{ vars.REASONING_EFFORT }}
          USE_ASKNEWS: ${{ vars.USE_ASKNEWS }}
