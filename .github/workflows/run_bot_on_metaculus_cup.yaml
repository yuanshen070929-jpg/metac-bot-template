name: Forecast on Metaculus Cup

# Manual only. Bots are not prize-eligible in the Metaculus Cup; it is a
# practice ground against human forecasters, and every run costs LLM credit.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Run bot
        run: uv run python run_bot.py --mode metaculus_cup
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          BOT_PROFILE: ${{ vars.BOT_PROFILE }}
          FORECASTER_MODELS: ${{ vars.FORECASTER_MODELS }}
          RESEARCH_MODELS: ${{ vars.RESEARCH_MODELS }}
          SAMPLES_PER_MODEL: ${{ vars.SAMPLES_PER_MODEL }}
          REASONING_EFFORT: ${{ vars.REASONING_EFFORT }}
          MAX_QUESTIONS_PER_RUN: ${{ vars.MAX_QUESTIONS_PER_RUN }}
          USE_ASKNEWS: ${{ vars.USE_ASKNEWS }}
